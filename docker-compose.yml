services:
  xray:
    image: ghcr.io/ed-asriyan/rkn-server-deploy:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - SERVER_NAME=${SERVER_NAME:-${COMPOSE_PROJECT_NAME}}
      - HOST=${HOST:?HOST is required}
      - PORT=${PORT:-443}
      - SNIS=${SNIS:?SNIS is required}
      - FALLBACK_PROXY_TARGET=${FALLBACK_PROXY_TARGET}
      - FINGERPRINT=${FINGERPRINT:-chrome}
      - NUMBER_OF_USERS=${NUMBER_OF_USERS:-256}
      - SEED=${SEED}
      - WHITELIST_DOMAINS=${WHITELIST_DOMAINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - NEXT_HOP_HOST=${NEXT_HOP_HOST}
      - NEXT_HOP_PORT=${NEXT_HOP_PORT}
      - NEXT_HOP_SNIS=${NEXT_HOP_SNIS}
      - NEXT_HOP_FINGERPRINT=${NEXT_HOP_FINGERPRINT}
      - NEXT_HOP_PUBLIC_KEY=${NEXT_HOP_PUBLIC_KEY}
      - NEXT_HOP_UUID=${NEXT_HOP_UUID}
