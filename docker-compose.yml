services:
  xray:
    image: ghcr.io/ed-asriyan/rkn-server-deploy:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - MODE=${MODE:-vless-reality-xhttp}
      - SERVER_NAME=${SERVER_NAME:-${COMPOSE_PROJECT_NAME}}
      - SERVER_UUID=${SERVER_UUID}
      - HOST=${HOST:?HOST is required}
      - PORT=${PORT:-443}
      - SNIS=${SNIS:?SNIS is required}
      - FALLBACK_PROXY_TARGET=${FALLBACK_PROXY_TARGET}
      - FINGERPRINT=${FINGERPRINT:-chrome}
      - XHTTP_PATH=${XHTTP_PATH:-/}
      - XHTTP_MODE=${XHTTP_MODE:-auto}
      - NUMBER_OF_USERS=${NUMBER_OF_USERS:-256}
      - SEED=${SEED}
      - WHITELIST_DOMAINS=${WHITELIST_DOMAINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - NEXT_HOP=${NEXT_HOP}
      - NEXT_HOP_UPDATE_INTERVAL=${NEXT_HOP_UPDATE_INTERVAL:-3600}
      - NEXT_HOP_PROBE_URL=${NEXT_HOP_PROBE_URL:-http://cp.cloudflare.com/generate_204}
      - NEXT_HOP_PROBE_INTERVAL=${NEXT_HOP_PROBE_INTERVAL:-1m}

  traffic-reporter:
    image: ghcr.io/ed-asriyan/rkn-server-deploy:latest
    restart: unless-stopped
    network_mode: host
    command: ["traffic-reporter"]
    volumes:
      - traffic_data:/data
    environment:
      - SERVER_UUID=${SERVER_UUID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}

volumes:
  traffic_data:
